[package]
name = "fastbrew"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "A fast Rust reimplementation of the Homebrew client"
license = "BSD-2-Clause"
default-run = "fastbrew"

[lib]
name = "fastbrew"
path = "src/lib.rs"

[[bin]]
name = "fastbrew"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
memmap2 = "0.9"
rkyv = { version = "0.8", features = ["std", "bytecheck"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "json", "stream"] }
rayon = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
tar = "0.4"
walkdir = "2"
regex = "1"
goblin = "0.9"
plist = "1"
xattr = "1"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "user", "process", "signal"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indicatif = "0.17"
owo-colors = { version = "4", features = ["supports-colors"] }
unicode-width = "0.2"
strsim = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
dirs = "6"
glob = "0.3"
uuid = { version = "1", features = ["v4"] }
filetime = "0.2"
crossbeam-channel = "0.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
